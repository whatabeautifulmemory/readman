# Tag vX.Y.Z → signed release APK attached to a GitHub Release (what Obtainium tracks).
# Secrets: KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
name: Release
on:
  push:
    tags: ['v*']
  # Manual run = signing dry-run: builds the signed APK as a workflow artifact, publishes nothing.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          # tr: a pasted value may carry line wraps or a stray shell prompt char; base64 -d rejects those.
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]%' | base64 -d > "$RUNNER_TEMP/release.jks"
        env: { KEYSTORE_BASE64: "${{ secrets.KEYSTORE_BASE64 }}" }
      - name: Validate keystore + passwords + alias
        run: keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Build signed release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"; [ "$GITHUB_REF_TYPE" = tag ] || VERSION="0.0.0"
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease -PversionName="$VERSION"
          cp app/build/outputs/apk/release/app-release.apk "readman-v${VERSION}.apk"
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with: { name: readman-signed-dryrun, path: readman-v*.apk }
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: readman-v*.apk
          generate_release_notes: true
          # v1.2.3-rc1 → pre-release, so Obtainium users who did not opt in are not updated to it
          prerelease: ${{ contains(github.ref_name, '-') }}
